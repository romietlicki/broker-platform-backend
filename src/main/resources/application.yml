server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: broker-platform-backend

  datasource:
    url: jdbc:mysql://localhost:3306/broker_platform?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_schema: broker_platform

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@brokerplatform.com}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
    expiration-ms: 86400000       # 24h
    refresh-expiration-ms: 604800000  # 7 dias

  frontend-url: ${FRONTEND_URL:http://localhost:4200}

  insurer:
    icatu:
      base-url: https://api.icatuseguros.com.br/relacionamento-parceiro/vida/pos-venda/v4
      subscription-key: ${ICATU_SUBSCRIPTION_KEY:changeme}
      company-code: ${ICATU_COMPANY_CODE:001}
      enabled: true
    azos:
      base-url: https://api.azos.com.br/v1
      api-key: ${AZOS_API_KEY:changeme}
      enabled: false
    mongeral:
      base-url: https://api.mongeral.com.br/v1
      api-key: ${MONGERAL_API_KEY:changeme}
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.brokerplatform: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/broker-platform.log

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
